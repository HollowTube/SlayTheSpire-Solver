name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Job-wide so every cargo invocation (the maturin build in the install
      # step, `cargo check`, `cargo test`) shares one set of build artifacts.
      RUSTFLAGS: "-D warnings"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create venv and install
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Check generated regions are up to date
        run: python scripts/gen_ids.py --check

      - name: Check Rust (no warnings)
        run: cargo check

      - name: Test Rust crates
        # The root crate is a pyo3 cdylib, so a bare `cargo test` would try
        # to link it; test the library crates by name.
        run: cargo test -p sts-ids -p sts-bridge

      - name: Lint with ruff
        run: |
          source .venv/bin/activate
          ruff check python/ tests/ integtests/
          ruff format --check python/ tests/ integtests/

      - name: Type-check with mypy
        run: |
          source .venv/bin/activate
          mypy python/ tests/ --ignore-missing-imports

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest tests/ -q

      - name: Restore bridge_mod (.NET project sanity check)
        # Full `dotnet build` requires the proprietary sts2.dll from a local
        # STS2 install (not available in CI), so this only validates the
        # csproj/NuGet config. Build bridge_mod locally to catch type errors.
        run: dotnet restore bridge_mod/sts_sim_bridge_mod.csproj
