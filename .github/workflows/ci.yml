name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Job-wide so every cargo invocation (the maturin build in the install
      # step, `cargo check`, `cargo test`) shares one set of build artifacts.
      # scripts/verify.sh defaults to the same value.
      RUSTFLAGS: "-D warnings"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create venv and install
        run: scripts/dev-setup.sh

      - name: Verify (generated ids, cargo check, Rust crate tests, ruff, mypy, pytest)
        run: scripts/verify.sh

      - name: Restore bridge_mod (.NET project sanity check)
        # Full `dotnet build` requires the proprietary sts2.dll from a local
        # STS2 install (not available in CI), so this only validates the
        # csproj/NuGet config. Build bridge_mod locally to catch type errors.
        run: dotnet restore bridge_mod/sts_sim_bridge_mod.csproj
