[package]
name = "sts-sim"
version = "0.1.0"
edition = "2021"

[lib]
name = "_sts_sim"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
rand = "0.8"
rand_pcg = "0.3"
rayon = "1"
sts-ids = { path = "crates/sts-ids" }

[workspace]
members = [".", "crates/sts-bridge", "crates/sts-ids"]
# `cargo check` at the root covers every crate. Run the library tests with
# `cargo test -p sts-ids -p sts-bridge`: a bare `cargo test` also links the
# pyo3 cdylib.
default-members = [".", "crates/sts-bridge", "crates/sts-ids"]
