[package]
name = "sts-sim"
version = "0.1.0"
edition = "2021"

[lib]
name = "_sts_sim"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
rand = "0.8"
rand_pcg = "0.3"
rayon = "1"

[workspace]
members = [".", "crates/sts-bridge"]
# `cargo check` at the root covers both crates. Run the bridge tests with
# `cargo test -p sts-bridge`: a bare `cargo test` also links the pyo3 cdylib.
default-members = [".", "crates/sts-bridge"]
