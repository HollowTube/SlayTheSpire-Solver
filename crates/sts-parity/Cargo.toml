[package]
name = "sts-parity"
version = "0.1.0"
edition = "2021"
description = "Live sim-vs-game parity: plays each Ironclad card in the game and in the sim and diffs the resulting states"

[lib]
name = "sts_parity"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sts-bridge = { path = "../sts-bridge" }
sts-ids = { path = "../sts-ids" }
sts-sim = { path = "../.." }

[[test]]
name = "live_cards"
harness = false
