[package]
name = "sts-bridge"
version = "0.1.0"
edition = "2021"
description = "Typed game interface for Slay the Spire 2: GameState, the Backend trait and the MCPTest bridge backend"

[lib]
name = "sts_bridge"

[dependencies]
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sts-ids = { path = "../sts-ids" }
thiserror = "2"

[dev-dependencies]
jsonschema = { version = "0.60", default-features = false }
